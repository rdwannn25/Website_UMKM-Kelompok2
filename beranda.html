<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMKM Digital Hub - Beranda</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        
        .hero {
            background-color: #e8f5ee;
            padding: 65px 0;
        }

        .hero h1 {
            font-weight: bold;
            color: #198754;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 25px;
        }

        .category-card {
            background-color: white;
            padding: 25px 15px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: #333;
            height: 100%;
            transition: 0.3s;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .category-card i {
            font-size: 35px;
            color: #198754;
        }

        .product-card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
        }

        .product-card img {
            height: 190px;
            object-fit: cover;
        }

        .price {
            color: #198754;
            font-weight: bold;
        }

        footer {
            background-color: #198754;
            color: white;
            padding: 30px 0;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .locations {
            padding: 48px 0;
            background-color: #f3faf5;
        }

        .location-details {
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
        }

        .location-details h2 {
            margin-bottom: 10px;
            color: #183b2b;
            font-weight: 700;
        }

        .location-details p {
            margin-bottom: 0;
            color: #66736b;
            line-height: 1.5;
        }

        .location-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1030;
            display: flex;
            width: 56px;
            height: 56px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #198754;
            color: white;
            font-size: 24px;
            text-decoration: none;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
            transition: background-color 0.2s, transform 0.2s;
        }

        .location-button:hover {
            background-color: #146c43;
            color: white;
            transform: translateY(-2px);
        }

        .location-button:focus-visible {
            outline: 3px solid #a3cfbb;
            outline-offset: 3px;
        }
        
    </style>
</head>

<body>

     <!-- HEADER -->
    <div id="header-container"></div>

    <!-- BERANDA / HERO -->
    <section class="hero">
        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-7">

                    <h1>Selamat Datang di UMKM Digital Hub</h1>

                    <p class="mt-3">
                        Temukan berbagai produk unggulan dari pelaku
                        UMKM lokal. Dukung produk dalam negeri dan
                        kembangkan usaha lokal bersama kami.
                    </p>

                    <a href="kategori.html" class="btn btn-success mt-2">
                        Jelajahi Produk
                    </a>

                </div>

                <div class="col-md-5 text-center mt-4 mt-md-0">

                    <img
                        src="https://kliklegal.com/wp-content/uploads/2023/04/Sumber-Pajakku-1.webp"
                        class="img-fluid rounded"
                        alt="UMKM Digital Hub">

                </div>

            </div>

        </div>
    </section>

    <!-- TOMBOL LOKASI MELAYANG -->
    <a href="#locations" 
    class="location-button"
    aria-label="Lihat lokasi UMKM"
    title="Lihat lokasi">
        <i class="bi bi-geo-alt-fill"></i>
    </a>

    <!-- PEMANGGILAN FOOTER -->
    <div id="footer-container"></div>

    <!--LOKASI BUTTON -->
    <a href="lokasi.html" class="location-button" aria-label="Lihat lokasi UMKM" title="Lihat lokasi">
        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>
    </a>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Memanggil header dan footer -->
    <script>

    <!-- Memanggil header.html -->
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Header gagal dimuat:", error);
            });


    <!-- Memanggil footer.html -->
    
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Footer gagal dimuat:", error);
            });
    </script>

</body>
</html>
