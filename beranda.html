<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UMKM Digital Hub - Beranda</title>

    <!-- Bootstrap CSS Lokal -->
    <link rel="stylesheet" href="Asset/css/bootstrap.min.css">

    <!-- Bootstrap Icons Lokal -->
    <link rel="stylesheet" href="Asset/icons/bootstrap-icons-1.11.3">

    <style>

        /* HERO SECTION */
        .hero {
            background-color: #e8f5ee;
            padding: 65px 0;
        }

        .hero h1 {
            font-weight: bold;
            color: #198754;
        }

        .hero p {
            color: #333;
            line-height: 1.8;
        }

        .hero img {
            max-height: 320px;
            object-fit: cover;
        }

        /* TOMBOL LOKASI MELAYANG */
        .location-button {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 1030;

            display: flex;
            width: 56px;
            height: 56px;

            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background-color: #198754;
            color: white;

            font-size: 24px;
            text-decoration: none;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);

            transition: background-color 0.2s, transform 0.2s;
        }

        .location-button:hover {
            background-color: #146c43;
            color: white;
            transform: translateY(-2px);
        }

        .location-button:focus-visible {
            outline: 3px solid #a3cfbb;
            outline-offset: 3px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero {
                padding: 45px 0;
            }

            .hero h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

    <!-- HEADER -->
    <div id="header-container"></div>


    <!-- BERANDA / HERO SECTION -->
    <section class="hero">
        <div class="container">

            <div class="row align-items-center">

                <!-- KONTEN HERO -->
                <div class="col-md-7">

                    <h1>Selamat Datang di UMKM Digital Hub</h1>

                    <p class="mt-3">
                        Temukan berbagai produk unggulan dari pelaku
                        UMKM lokal. Dukung produk dalam negeri dan
                        kembangkan usaha lokal bersama kami.
                    </p>

                    <a href="kategori.html" class="btn btn-success mt-2">
                        <i class="bi bi-grid me-1"></i>
                        Jelajahi Produk
                    </a>

                </div>


                <!-- GAMBAR HERO -->
                <div class="col-md-5 text-center mt-4 mt-md-0">

                    <img
                        src="https://kliklegal.com/wp-content/uploads/2023/04/Sumber-Pajakku-1.webp"
                        class="img-fluid rounded"
                        alt="UMKM Digital Hub">

                </div>

            </div>

        </div>
    </section>


    <!-- TOMBOL LOKASI MELAYANG -->
    <a href="lokasi.html"
       class="location-button"
       aria-label="Lihat lokasi UMKM"
       title="Lihat lokasi">

        <i class="bi bi-geo-alt-fill" aria-hidden="true"></i>

    </a>


    <!-- FOOTER -->
    <div id="footer-container"></div>


    <!-- BOOTSTRAP JAVASCRIPT LOKAL -->
    <script src="Asset/js/bootstrap.bundle.min.js"></script>


    <!-- MEMANGGIL HEADER DAN FOOTER -->
    <script>

        // Memanggil header.html
        fetch("header.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Header tidak ditemukan");
                }

                return response.text();
            })
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Header gagal dimuat:", error);
            });


        // Memanggil footer.html
        fetch("footer.html")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Footer tidak ditemukan");
                }

                return response.text();
            })
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Footer gagal dimuat:", error);
            });

    </script>

</body>
</html>
