<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokasi UMKM - KantinKita</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="Asset/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="Asset/css/bootstrap-icons.min.css">

    <style>
        .hero {
            background-color: #e8f5ee;
            padding: 45px 0;
            text-align: center;
        }
        
        .hero h1 {
            font-weight: bold;
            color: #198754;
        }
        
        .location-content {
            padding: 50px 0;
        }
        
        .section-title {
            font-weight: bold;
            color: #198754;
            margin-bottom: 10px;
        }
        
        .location-card {
            background: white;
            border: none;
            border-radius: 10px;
            padding: 25px;
            height: 100%;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }
        
        .location-card h4 {
            color: #198754;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .location-info {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .location-info i {
            color: #198754;
            font-size: 20px;
            margin-right: 8px;
        }
        
        .map-card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            height: 100%;
        }
        
        iframe {
            width: 100%;
            height: 400px;
            border: none;
            border-radius: 8px;
        }
        
        @media(max-width: 768px) {
            iframe {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Memanggil header.html -->
    <div id="header-container"></div>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <h1>Lokasi UMKM Kami</h1>
            <p class="mt-3 mb-0">
                Temukan lokasi usaha kami dan kunjungi secara langsung.
            </p>
        </div>
    </section>

    <!-- INFORMASI LOKASI -->
    <section class="location-content">
        <div class="container">

            <div class="row g-4">

                <!-- INFORMASI ALAMAT -->
                <div class="col-md-4">
                    <div class="location-card">

                        <h4>
                            <i class="bi bi-shop"></i> KantinKita
                        </h4>

                        <div class="location-info">
                            <i class="bi bi-geo-alt-fill"></i>
                            <b>Alamat</b>
                            <p class="ms-4 mb-0">
                                Kota bandung, Jawa Barat, Indonesia
                            </p>
                        </div>

                        <div class="location-info">
                            <i class="bi bi-clock-fill"></i>
                            <b>Jam Operasional</b>
                            <p class="ms-4 mb-0">
                                09.00 - 21.00 WIB
                            </p>
                        </div>

                        <div class="location-info">
                            <i class="bi bi-telephone-fill"></i>
                            <b>Kontak</b>
                            <p class="ms-4 mb-0">
                                0821-2337-3370
                            </p>
                        </div>

                        <a href="https://www.google.com/maps/dir/?api=1&destination=-6.937914, 107.607281" target="_blank" class="btn btn-success w-100 mt-2">
                            <i class="bi bi-sign-turn-right"></i> Petunjuk Arah
                        </a>

                    </div>
                </div>

                <!-- GOOGLE MAPS DENGAN KOORDINAT -->
                <div class="col-md-8">
                    <div class="map-card">

                        <iframe src="https://maps.google.com/maps?q=-6.937914, 107.607281&z=16&output=embed" allowfullscreen loading="lazy">
                        </iframe>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- PEMANGGILAN FOOTER -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="Asset/js/bootstrap.bundle.min.js"></script>

    <!--Memanggil header dan footer-->
    <script>
        <!-- Memanggil header.html -->
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Header gagal dimuat:", error);
            });

        <!-- Memanggil footer.html -->
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Footer gagal dimuat:", error);
            });
    </script>

</body>

</html>
