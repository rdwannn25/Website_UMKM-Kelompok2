<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keranjang - UMKM Digital Hub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">

<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
            color: #198754;
        }

        .nav-link {
            color: #333;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #198754;
        }

        .hero {
            background-color: #e8f5ee;
            padding: 65px 0;
        }

        .hero h1 {
            font-weight: bold;
            color: #198754;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 25px;
        }

        .category-card {
            background-color: white;
            padding: 25px 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            height: 100%;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .category-card i {
            font-size: 35px;
            color: #198754;
        }

        .product-card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .product-card img {
            height: 190px;
            object-fit: cover;
        }

        .price {
            color: #198754;
            font-weight: bold;
        }

        footer {
            background-color: #198754;
            color: white;
            padding: 30px 0;
        }

        footer a {
            color: white;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>


<body>

    <!-- PEMANGGILAN HEADER -->
    <div id="header-container"></div>
    
    <!-- Judul -->
    <section class="judul">
    <div class="container">
        <h1 class="fw-bold">Keranjang Saya</h1>
        <p class="text-secondary mb-0">Berikut produk yang sudah kamu pilih. Periksa kembali sebelum membuat pesanan.</p>
    </div>
    </section>

    <!-- Isi Keranjang -->
    <div class="container py-5">
    <div class="row g-4">

        <div class="col-lg-8">
            <div class="kotak-keranjang">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="fw-bold">Produk Pilihan</h5>
                    <span id="jumlahItem" class="text-secondary">0 produk</span>
                </div>
                <div id="daftarKeranjang"></div>
            </div>
        </div>
    
        <div class="col-lg-4">
            <div class="ringkasan">
                <h5 class="fw-bold mb-4">Ringkasan Belanja</h5>
                <div class="d-flex justify-content-between mb-3">
                    <span>Jumlah Produk</span><span id="totalItem">0</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span>Total Harga</span><span id="totalHarga">Rp0</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <strong>Total Belanja</strong>
                    <strong class="harga" id="totalBayar">Rp0</strong>
                </div>
                <button class="tombol-pesan" onclick="buatPesanan()">Buat Pesanan</button>
                <p class="small text-secondary mt-3 mb-0">Pesanan ini hanya simulasi untuk keperluan website.</p>
                <div id="pesan" class="small mt-3"></div>
            </div>
        </div>

    </div>
    </div>

<!-- PEMANGGILAN FOOTER -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Memanggil header dan footer -->
    <script>

    <!-- Memanggil header.html -->
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Header gagal dimuat:", error);
            });

    <!-- Memanggil footer.html -->
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer-container").innerHTML = data;
            })
            .catch(error => {
                console.error("Footer gagal dimuat:", error);
            });
    </script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const products = [
    { id: 1, name: "Keripik Pisang", price: 15000, store: "UMKM Lokal", img: "https://placehold.co/400x250/e8f5ee/198754?text=Keripik+Pisang" },
    { id: 2, name: "Es Buah", price: 10000, store: "UMKM Lokal", img: "https://placehold.co/400x250/e8f5ee/198754?text=Es+Buah" },
    { id: 3, name: "Kaos Lokal", price: 75000, store: "UMKM Lokal", img: "https://placehold.co/400x250/e8f5ee/198754?text=Kaos+Lokal" },
    { id: 4, name: "Kerajinan Tangan", price: 50000, store: "UMKM Lokal", img: "https://placehold.co/400x250/e8f5ee/198754?text=Kerajinan+Tangan" }
];

function getCart() {
    return JSON.parse(localStorage.getItem("umkmCart") || "[]");
}

function saveCart(cart) {
    localStorage.setItem("umkmCart", JSON.stringify(cart));
}

function cartCount() {
    return getCart().reduce((jumlah, item) => jumlah + item.qty, 0);
}

function formatRupiah(nilai) {
    return "Rp" + nilai.toLocaleString("id-ID");
}

// Menampilkan isi keranjang
function tampilkanKeranjang() {
    let keranjang = getCart(), jumlah = 0, total = 0;

    document.getElementById("daftarKeranjang").innerHTML = keranjang.length
        ? keranjang.map(item => {
        let p = products.find(x => x.id === item.id) || item;
        if (!p.name || !p.price) return "";
            jumlah += item.qty;
            total += p.price * item.qty;

            return `
            <div class="produk">
                <img src="${p.img}" alt="${p.name}"
                     onerror="this.src='https://placehold.co/150x150?text=Produk'">
                <div class="detail-produk">
                    <h6 class="fw-bold mb-1">${p.name}</h6>
                    <small class="text-secondary">${p.store}</small>
                    <p class="harga mt-2 mb-2">${formatRupiah(p.price)}</p>
                    <div class="d-flex align-items-center gap-3">
                        <div class="tombol-jumlah">
                            <button onclick="ubahJumlah(${p.id},-1)">-</button>
                            <span class="mx-2">${item.qty}</span>
                            <button onclick="ubahJumlah(${p.id},1)">+</button>
                        </div>
                        <button class="hapus" onclick="hapusProduk(${p.id})">Hapus</button>
                    </div>
                </div>
                <strong class="harga">${formatRupiah(p.price * item.qty)}</strong>
            </div>`;
        }).join("")
        : `<div class="text-center py-5">
            <h1>🛒</h1>
            <h5>Keranjang masih kosong</h5>
            <p class="text-secondary">Silakan pilih produk terlebih dahulu.</p>
            <a href="kategori.html" class="btn btn-success">Pilih Produk</a>
           </div>`;

    document.getElementById("jumlahItem").textContent = jumlah + " produk";
    document.getElementById("totalItem").textContent = jumlah;
    document.getElementById("totalHarga").textContent = formatRupiah(total);
    document.getElementById("totalBayar").textContent = formatRupiah(total);

    document.querySelectorAll("[data-cart-count]").forEach(el => el.textContent = cartCount());
}

// Mengubah jumlah produk
function ubahJumlah(id, angka) {
    let cart = getCart(), item = cart.find(x => x.id === id);
    if (item) item.qty = Math.max(1, item.qty + angka);
    saveCart(cart);
    tampilkanKeranjang();
}

// Menghapus produk
function hapusProduk(id) {
    saveCart(getCart().filter(x => x.id !== id));
    tampilkanKeranjang();
}

// Membuat pesanan simulasi
function buatPesanan() {
    let pesan = document.getElementById("pesan");

    if (!getCart().length) {
        pesan.textContent = "Keranjang masih kosong. Silakan pilih produk.";
        pesan.className = "text-danger small mt-3";
        return;
    }

    saveCart([]);
    tampilkanKeranjang();
    pesan.textContent = "Pesanan berhasil dibuat. Terima kasih!";
    pesan.className = "text-success small mt-3";
}

tampilkanKeranjang();
</script>

</body>
</html>
